    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
    //等待滑动停止
    async function scrollDelayedFunction(time=10000) {
        console.log('开始');
        let ele=document.querySelector('.rightbody')

        let startpos=ele.scrollLeft
        let st = true
        while (true){
            // 这会“阻塞”函数的执行，直到Promise被解决（即3秒后）
            await delay(100);
            let endpos=ele.scrollLeft
            if (startpos===endpos){
                return false
            }
        }
        console.log('3秒后执行');
        // 这里放置你希望延迟后执行的代码
        console.log('结束');
    }
    async function DelayedFunction(time=10000) {
        await delay(time);
    }

    let sousuoState=false
    function showSouSuo(e){
        let souSuoC = document.getElementById('sousuoButtonC');
        if (souSuoC.contains(e.target)){
            return
        }
        if (sousuoState){
            souSuoC.style.display='none'
            souSuoC.style.backgroundColor='initial'
        }else {
            souSuoC.querySelector('.ssinputbox').style.width=window.innerWidth-30-60+'px'
            souSuoC.style.display='flex'
            souSuoC.style.backgroundColor='white'
            let body= document.querySelector('body')
            console.log(body)
            body.addEventListener('click',clearSouSuo)
            e.preventDefault()
            e.stopPropagation()
        }
        sousuoState=!sousuoState
    }
    function clearSouSuo(e){
        e.preventDefault()
        e.stopPropagation()
        let tg = document.querySelector('.menuToggleBG')
        if (isDescendant(tg,e.target)){
            return
        }
        let souSuoC = document.getElementById('sousuoButtonC');
        if (!souSuoC.contains(e.target)){
            souSuoC.style.display='none'
            sousuoState=!sousuoState
            document.querySelector('body').removeEventListener('click',clearSouSuo)
        }
    }
