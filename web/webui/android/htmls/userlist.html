    <script>
        function adjustButtonFontSize(e) {
            console.log("reset size")
            const buttons = document.querySelectorAll('.listbutton');
            let longestText = '';
            let longestWidth = 0;

            // 找到最长的文本
            buttons.forEach(button => {
                const text = button.textContent || button.innerText;
                if (text.length > longestText.length) {
                    longestText = text;
                }
            });

            // 创建一个临时的 span 元素，用于测量最长文本的宽度和高度
            const testElement = document.createElement('span');
            testElement.style.position = 'absolute';
            testElement.style.visibility = 'hidden';
            testElement.style.whiteSpace = 'nowrap';
            testElement.style.fontSize = '100vw'; // 初始设置一个非常大的字体大小
            testElement.textContent = longestText;
            document.body.appendChild(testElement);

            const testRect = testElement.getBoundingClientRect();
            const testWidth = testRect.width;
            const testHeight = testRect.height;

            // 计算适合最长文本的字体大小
            buttons.forEach(button => {
                const buttonRect = button.getBoundingClientRect();
                const buttonWidth = buttonRect.width;
                const buttonHeight = buttonRect.height;

                const maxWidth = buttonWidth / testWidth * 100;
                const maxHeight = buttonHeight / testHeight * 100;
                const fontSize = Math.min(maxWidth, maxHeight);

                // 设置所有按钮的字体大小
                button.style.fontSize = `${fontSize}vw`;
            });

            // 移除测试元素
            document.body.removeChild(testElement);
        }

        // 初始调用
        adjustButtonFontSize();

        // 监听窗口大小变化
        window.addEventListener('resize', adjustButtonFontSize);
        document.getElementById('userCO').addEventListener('transitionend', adjustButtonFontSize);
    </script>
