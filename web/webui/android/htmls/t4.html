        #nodebufferTime {

<script>
    // window.onload = function () {

    var items1 = document.getElementById("itemC1");

    var leftBtn = document.querySelectorAll(".btn-left");
    var rightBtn = document.querySelectorAll(".btn-right");
    var index = 0;

    //清除class

    function createTime(target, start, end) {
        let li = document.createElement('div')
        li.setAttribute('class', 'itemTime')
        li.style.display = 'none'
        let p = document.createElement('p')
        // p.innerText = " "
        // target.appendChild(li)
        // li.appendChild(p)
        for (let i = 0; i < end - start; i++) {
            let li = document.createElement('div')
            li.setAttribute('class', 'itemTime')
            li.style.display = 'none'
            let p = document.createElement('p')
            p.innerText = i + start
            target.appendChild(li)
            li.appendChild(p)
        }
    }

    function getitem(itemc) {
        let childs = itemc.childNodes
        let arry = []
        for (let c of childs) {
            try {
                if (c.classList.contains('itemTime')) {
                    arry.push(c)
                }
            } catch (e) {
                // console.log(c)
            }
        }
        return arry
    }

    let items = []
    for (let i in itemCs) {
        if (i === "0") {
            const now = new Date();
            const year = now.getFullYear()+1;   // 获取当前年份（例如 2026）
            // const month = now.getMonth() + 1; // 获取当前月份（注意：JS中月份从0开始，所以要+1）
            // const day = now.getDate();        // 获取当前日期

            createTime(itemCs[i], 1980, year)
        }
        if (i === "1") {
            createTime(itemCs[i], 1, 13)
        }
        if (i === "2") {
            createTime(itemCs[i], 1, 31)
        }
        if (i === "3") {
            createTime(itemCs[i], 0, 24)
        }
        if (i === "4") {
            createTime(itemCs[i], 0, 60)
        }
        if (i === "5") {
            createTime(itemCs[i], 0, 60)
        }

    }
    for (let item of itemCs) {
        let array = getitem(item)
        items.push(array)
    }
    var clearclass = function (item) {
        for (let i = 0; i < item.length; i++) {
            item[i].className = "itemTime";
            item[i].style.display = 'none'
        }
    }

    /*只显示一个class*/
    function move(array, n, i) {
        clearclass(array);

        if (n - 1 > 0) {
            array[n - 1].className = "itemTime";
            array[n - 1].style.display = 'initial'
        }else {
            // array[array.length - 1].className = "itemTime";
            // array[array.length - 1].style.display = 'initial'
        }

        array[n].className = "itemTime active";
        array[n].style.display = 'initial'

        if (n + 1 < array.length - 1) {
            array[n + 1].className = "itemTime";
            array[n + 1].style.display = 'initial'
        }else {
            // array[0].className = "itemTime";
            // array[0].style.display = 'initial'
        }

    }

    let nums = {}
    for (let index in rightBtn) {
        nums[index] = 0
        // index=index-1
        let btnr = rightBtn[index]
        let btnl = leftBtn[index]
        btnr.onclick = function () {
            if (nums[index] < items[index].length - 1) {
                nums[index]++;
            } else {
                nums[index] = 0;
            }
            move(items[index], nums[index], index);
        }
        btnl.onclick = function () {

            if (nums[index] < items[index].length ) {

                nums[index]--;
                if (nums[index] < 0) {
                    nums[index] = items[index].length - 1
                }
            } else {
                nums[index] = items[index].length - 1;
            }
            move(items[index], nums[index]);
        }

    }

    document.querySelector('#timeBackground').addEventListener('click', timecancal)

    function timecancal(e) {
        if (e.target !== this) {
            return
        }
        document.querySelector('#nodebufferTime').style.display = 'none'
        timeFuntion = null
    }

    document.getElementById('timeRight').addEventListener('click', getTime)
    document.getElementById('timeCancel').addEventListener('click', timecancal)
