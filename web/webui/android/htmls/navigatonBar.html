    $("#nav a").on("click", function () {

    });
    $("#nav a").on("touchend", function () {

    });
    $("#nav a").on("mouseout", function () {

    let lastScrollTime = 0;
    let scrollStart = 0;
    let scrollDistance = 0;
    let halfScreenHeight = (function () {
        let len=200
        if (window.innerWidth>window.innerHeight){
            if (window.innerWidth>window.innerHeight*1.6){
                len=0.4*window.innerHeight
            }else {
                len=0.3*window.innerWidth
            }
        }else {
            if (window.innerWidth>window.innerHeight*0.7){
                len=0.5*window.innerWidth
            }else {
                len=0.4*window.innerWidth
            }
        }
        return len
    })()
    let targetPosition=0;

    // 监听滚动事件
    const scrollEle=document.querySelector('.rightbody');
    const thSc=throttle(scrollRe,30)
    const thScEnd=debounce(reP,50)

    function scrollRe() {
        const currentTime = Date.now();
        const currentTimeScroll = scrollEle.scrollLeft;
        // 如果是第一次滚动或者距离上次滚动超过半秒
        if (currentTime - lastScrollTime > 500 || scrollStart === 0) {
            scrollStart = currentTimeScroll;
            lastScrollTime = currentTime;
            scrollDistance = 0;
        } else {
            // 计算自上次检测以来的滚动距离
            scrollDistance = currentTimeScroll - scrollStart;
            // 如果在0.5秒内滚动距离小于屏幕的一半，则自动复位
            if (currentTime - lastScrollTime <= 500 && Math.abs(scrollDistance) < halfScreenHeight) {
                // 这里使用setTimeout模拟异步复位，实际中可能需要更复杂的逻辑
               thScEnd()
            }else {
                scrollEle.removeEventListener('scroll',thSc)
                eleVw.style.width=''
                clearTimeout(navTimeout);
                targetPosition=0;
            }
            // 更新最后一次滚动时间
            lastScrollTime = currentTime;
        }
    }

    function reP() {
        // setTimeout(() => {
            scrollEle.scrollTo(targetPosition, scrollStart);
            console.log('自动复位滚动条');
        // }, 10); // 延时10毫秒执行，确保当前滚动事件处理完成
    }
    function throttle(func, limit) {
        let lastRan;
        return function() {
            const context = this;
            const now = Date.now();
            if (!lastRan || (now - lastRan >= limit)) {
                func.apply(context);
                lastRan = now;
            }
        };
    }

    let navTimeout;
    function debounce(func, wait) {
        return function executedFunction(...args) {
            const context = this;
            // 如果上一个事件还在等待中，则清除它
            clearTimeout(navTimeout);
            // 设置一个新的定时器
            navTimeout = setTimeout(() => {
                func.apply(context, args);
            }, wait);
        };
    }

    // 注意：这种实现方式在快速滚动或滚动停止后立即反向滚动时可能表现不佳。
    // 对于更精确的控制，可能需要考虑使用requestAnimationFrame或其他定时器策略来更精细地控制检测逻辑。
