<script>
    const drageli = document.querySelector("#dropeable");
    drageli.addEventListener('DOMContentLoaded', function () {
        var list = document.getElementById('#dropeable');
        var scrollWidth = list.scrollWidth; // 获取滚动区域的宽度
        var clientWidth = list.clientWidth; // 获取可见区域的宽度
        var scrollLeft = list.scrollLeft; // 获取当前的滚动位置

        // 当鼠标滚轮滚动时更新滚动位置
        list.addEventListener('wheel', function (e) {
            // 获取滚动的方向和距离
            var delta = e.deltaY < 0 ? 1 : -1;
            // 计算新的滚动位置
            var newScrollLeft = scrollLeft - delta * (clientWidth / 5); // 5 是滚动的敏感度，可以根据需要进行调整
            // 更新滚动位置
            list.scrollLeft = newScrollLeft;
            // 阻止默认的鼠标滚轮行为，以防止页面滚动
            e.preventDefault();
        });
    });
    drageli.addEventListener('DOMContentLoaded', function () {
        var list = document.getElementById('dropeable');
        var scrollWidth = list.scrollWidth; // 获取滚动区域的宽度
        var clientWidth = list.clientWidth; // 获取可见区域的宽度
        var scrollLeft = list.scrollLeft; // 获取当前的滚动位置
        var mousedownX, mousemoveX, mouseupX;

        // 当鼠标按下时开始跟踪鼠标移动
        list.addEventListener('mousedown', function (e) {
            mousedownX = e.clientX; // 鼠标按下时的位置
            mousemoveX = e.clientX; // 初始的鼠标移动位置
            mouseupX = e.clientX; // 初始的鼠标释放位置
            document.addEventListener('mousemove', onMouseMove); // 添加鼠标移动事件监听器
            document.addEventListener('mouseup', onMouseUp); // 添加鼠标释放事件监听器
        });

        // 当鼠标移动时更新滚动位置
        function onMouseMove(e) {
            var dx = e.clientX - mousemoveX; // 计算鼠标移动的距离
            list.scrollLeft = scrollLeft + dx; // 更新滚动位置
            mousemoveX = e.clientX; // 更新鼠标移动的当前位置
        }

        // 当鼠标释放时停止跟踪鼠标移动
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove); // 移除鼠标移动事件监听器
            document.removeEventListener('mouseup', onMouseUp); // 移除鼠标释放事件监听器
            // 这里可以添加一些优化或额外的逻辑，比如限制滚动范围等。
        }
    });
</script>
