    <style>
        #serverSet{
            display: none;

        #serverSetbackground{

<script >
    let serverSet=document.querySelector("#serverSet")
    serverSet.parentNode.addEventListener('click',setShow)
    console.log('serverSet')
    let sSetState=false
    function setShow(e) {
        if (e.target!==this && serverSet.contains(e.target)){
            return
        }
        if (sSetState){
            serverSet.style.display='none'
            sSetState=false
        }else {
            serverSet.style.display='initial'
            sSetState=true
            fetch("http://" + address + ":" + port + "/map/Index/getAutoLink").then(Response => Response.json())
                .then(jsons => {
                    let abl = document.getElementById('autoBindList')
                    clearEleChildren(abl)

                    for (let value of jsons) {
                        let ele = document.createElement('div')
                        ele.setAttribute('class', 'setbutton')
                        ele.textContent = value
                        function unsetAutoLink(e) {
                            fetch("http://" + address + ":" + port +  "/map/Index/unsetAutoLink?"+value).
                            then(Response => Response.ok).then(b=>{
                                abl.removeChild(ele)
                            })
                        }
                        ele.addEventListener('click',function (e) {
                            choosePage2(ele,unsetAutoLink)
                        })
                        abl.appendChild(ele)
                    }
                })
            return false
        }
    }

    let serverSetbackground=document.querySelector("#serverSetbackground")
    serverSetbackground.addEventListener('click',setShowBack)

    function setShowBack(e) {
        if (e.target!==this && serverSet.contains(e.target)){
            return
        }
        if (showState){
            serverSet.style.display='initial'
            sSetState=true
        }else {
            serverSet.style.display='none'
            sSetState=false
            return false
        }

    }

    let ssetbcakbox = document.querySelector("#ssetbcakbox")
    ssetbcakbox.style.backgroundImage = "url(http://" + address + ":" + port + "/map/SelfPage/getBackPic)"
    ssetbcakbox.style.backgroundSize = 'cover';
    ssetbcakbox.style.backgroundPosition = 'center';


    class inputSSet{
        constructor(
            ele,
            inputEle,
            eleEven,
            pageEle,
            getUrl = "/map/setPage/getPageLen?",
            setUrl = "/map/setPage/setPageLen?",
        ) {
            this.serverSet = ele;
            this.inputEle = inputEle;
            this.button = eleEven;
            this.page = pageEle;
            this.geturl = getUrl;
            this.seturl = setUrl

            this.serverSet.addEventListener('click',this.showSetLenButton.bind(this))
            this.getOrgValue()
            this.rmSetLenButton=this.removeSetLenButton.bind(this)
        }

        getOrgValue(){
            fetch("http://" + address + ":" + port + this.geturl).then(Response => Response.text())
                .then(text => {
                        this.inputEle.value = text
                    }
                )
        }

        showSetLenButton(e) {
            console.log("showSetLenButton")
            this.button.style.display='flex'
            this.button.addEventListener('click',this.setLen.bind(this))
            this.page.addEventListener('click',this.rmSetLenButton)
            this.page.addEventListener('torchup',this.rmSetLenButton)

        }

        removeSetLenButton(e) {
            console.log("removeSetLenButton")
            var cs=window.getComputedStyle(e.target)
            var sct=cs.getPropertyValue('--sn')
            if (sct!=="i"){
                this.button.style.display='none'
                this.page.removeEventListener('click',this.rmSetLenButton)
                this.page.removeEventListener('torchup',this.rmSetLenButton)
            }else {
                if (!e.target.contains(this.inputEle)&&!e.target.contains(this.button)){
                    this.button.style.display='none'
                    this.page.removeEventListener('click',this.rmSetLenButton)
                    this.page.removeEventListener('torchup',this.rmSetLenButton)
                }
            }
        }

        setLen(e) {
            e.preventDefault()
            e.stopPropagation()
            console.log("setLen")
            fetch("http://" + address + ":" + port + this.seturl +this.inputEle.value)
                .then(Response => Response.text())
                .then(text => {
                        this.inputEle.value=text
                    }
                ).finally(f=>{
                this.button.style.display='none'
            })
            return false
        }
    }


    new inputSSet(document.querySelector("#sSetLen"),
        document.querySelector("#InputLen1"),
        document.querySelector("#InputPageLen1"),
        serverSet,"/map/setPage/getPageLen?1","/map/setPage/setPageLen1?")

    let showSEle= document.querySelector("#showServer")
    serverSet.addEventListener('click',getServer)
    let serverState
    function getServer(e) {
        fetch("http://" + address + ":" + port + "/map/selfPage/getupServer")
            .then(response => {
                return response.text();
            }).then(t => {
                if (t ==="server"){
                    showSEle.style.backgroundColor= 'rgb(170 112 221 / 90%)'
                    serverState=true
                    showSEle.textContent="打开"
                }else {
                    showSEle.style.backgroundColor= null
                    serverState=false
                    showSEle.textContent="关闭"
                }

            }).catch(error => {
            console.error('There was a problem with the fetch operation:', error);
            loadstop()
        });
    }

    serverSet.addEventListener('click',setServer)
    function setServer(e) {
        let param;
        if (serverState){
            param="user"
        }else {
            param="server"
        }
        fetch("http://" + address + ":" + port + "/map/selfPage/upServer?"+param)
            .then(response => {
                getServer()
            }).catch(error => {
            console.error('There was a problem with the fetch operation:', error);
            loadstop()
        });
    }

</script>
