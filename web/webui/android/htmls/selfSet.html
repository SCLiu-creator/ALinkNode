class inputSet{
    constructor(
        ele,
        inputEle,
        eleEven,
        pageEle,
        getUrl = "/map/setPage/getPageLen?",
        setUrl = "/map/setPage/setPageLen?",
    ) {
        this.setSet = ele;
        this.inputEle = inputEle;
        this.button = eleEven;
        this.page = pageEle;
        this.geturl = getUrl;
        this.seturl = setUrl

        this.setSet.addEventListener('click',this.showSetLenButton.bind(this))
        this.getOrgValue()
        this.rmSetLenButton=this.removeSetLenButton.bind(this)
    }

     getOrgValue(){
        fetch("http://" + address + ":" + port + this.geturl).then(Response => Response.text())
            .then(text => {
                this.inputEle.value = text
                }
            )
    }

     showSetLenButton(e) {
         console.log("showSetLenButton")
         this.button.style.display='flex'
         this.button.addEventListener('click',this.setLen.bind(this))
         this.page.addEventListener('click',this.rmSetLenButton)
         this.page.addEventListener('torchup',this.rmSetLenButton)
         // return false
    }

     removeSetLenButton(e) {
         console.log("removeSetLenButton")
        var cs=window.getComputedStyle(e.target)
        var sct=cs.getPropertyValue('--sn')
        if (sct!=="i"){
            this.button.style.display='none'
            this.page.removeEventListener('click',this.rmSetLenButton)
            this.page.removeEventListener('torchup',this.rmSetLenButton)
        }else {
            if (!e.target.contains(this.inputEle)&&!e.target.contains(this.button)){
                this.button.style.display='none'
                this.page.removeEventListener('click',this.rmSetLenButton)
                this.page.removeEventListener('torchup',this.rmSetLenButton)
            }
        }

        // return false
    }

     setLen(e) {
        e.preventDefault()
        e.stopPropagation()
         console.log("setLen")
        fetch("http://" + address + ":" + port + this.seturl +this.inputEle.value)
            .then(Response => Response.text())
            .then(text => {
                this.inputEle.value=text
                }
            ).finally(f=>{
            this.button.style.display='none'
        })
         return false
    }
}
