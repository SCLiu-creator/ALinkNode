        <script>
            // document.addEventListener('touchmove', function(event) {
            //   event.preventDefault();
            // }, { passive: false });
            let scrollState=true
            let continueScrollingT = false;
            function TochMoveX(container) {
                let flag = false;
                let isHorizontalScroll = false; // 新增：标记当前是否是横向滚动
                let initialMoveDetected = false; // 新增：是否已检测初始移动方向
                let downX;
                let downY;
                let scrollLeft=0;
                let scrollX;
                var lastMoveTime = 0;
                var lastMoveX = 0;
                var velocity = 0; // 末速度
                var frameRate = 7; // 帧率（大约60fps）
                var deceleration = 0.95; // 减速度因子，用于模拟滚动减速

                const threshold = 0; // 新增：方向判断阈值
                //按下
                $(document.body).on("touchstart", container, function (event) {
                    if (!scrollState){
                        return false
                    }
                    if (event.touches[0].clientX > leftwidth) {
                        var cs = window.getComputedStyle(event.target)
                        var sct = (cs.getPropertyValue('--my-tm') === 'sy')
                        if (!event.target.hasAttribute("draggable") && !sct) {
                            // console.log('mousedown')
                            flag = true;
                            downX = event.touches[0].clientX;
                            downY = event.touches[0].clientY; // 记录初始Y坐标
                            scrollLeft = $(this).scrollLeft();

                            lastMoveTime = Date.now();
                            lastMoveX = downX;
                            initialMoveDetected = false; // 重置方向检测
                            isHorizontalScroll = false; // 重置滚动方向
                        }else {
                            downX=0
                            lastMoveX=0
                            velocity=0
                        }
                    }
                });
                let time0=0;
                let time=0;
                //移动
                $(container).on("touchmove", function (event) {
                    // console.log('mousemove', flag)
                    if (!flag) {return }

                    const moveX = event.touches[0].clientX;
                    const moveY = event.touches[0].clientY; // 获取当前Y坐标

                    if (moveX ===downX && moveY === downY){
                        return
                    }

                    // 首次移动时检测方向
                    if (!initialMoveDetected) {
                        const deltaX = Math.abs(moveX - downX);
                        const deltaY = Math.abs(moveY - downY);

                        // 判断是横向还是纵向滑动
                        if (deltaX > deltaY && deltaX > threshold) {
                            isHorizontalScroll = true;
                        } else if (deltaY > deltaX && deltaY > threshold) {
                            isHorizontalScroll = false;
                            flag = false; // 如果是纵向滑动，直接结束处理
                            return;
                        }
                        initialMoveDetected = true;
                    }

                    if (isHorizontalScroll) {

                        scrollX = moveX - downX;
                        // console.log("moveX" + moveX);
                        // console.log("scrollX" + scrollX);
                        if (scrollX < 0 && scrollLeft > 0) {
                            $(this).scrollLeft(scrollLeft - scrollX)
                        } else {
                            $(this).scrollLeft(scrollLeft - scrollX)
                        }

                        // time=new Date().getTime()-time0
                        // time0=new Date().getTime()
                        // console.log("longtime :  "+time)
                        // 计算速度
                        var currentTime = Date.now();
                        var timeDelta = currentTime - lastMoveTime;
                        var moveDelta = moveX - lastMoveX;
                        if (timeDelta > 0) {
                            velocity = moveDelta / timeDelta;
                            lastMoveTime = currentTime;
                            lastMoveX = moveX;
                        }
                    }
                });
                //释放
                $(container).on("touchcancel", function () {
                    flag = false;
                });
                /**
                 * 注意：与 mouseout 事件不同，mouseleave 事件只有在鼠标指针离开被选元素时被触发，
                 * mouseout 事件在鼠标指针离开任意子元素时也会被触发。参见页面底部演示实例。
                 * 所以：如果mouseout的子元素存在溢出，并添加了超出加滚动，那么刚进入也会触发该事件，所以这里就不能使用。
                 * */
                //移出元素
                $(container).on("touchend", function (event) {
                    // console.log('mouseleave', event.pageX, document.body.offsetWidth)
                    flag = false;
                    if (event.changedTouches[0].clientX < 0 || event.changedTouches[0].clientX > document.body.offsetWidth) {
                        // console.log('在元素上移出')
                        flag = false;
                    }

                    continueScrollingT=true
                    continueScroll()
                    // return false
                });
                liulanstate = false
                // 继续滚动的函数
                let st=0

                function continueScroll() {
                    if ((!continueScrollingT && !flag) || liulanstate){
                        clearTimeout(st)
                        return;
                    }
                    // 使用末速度进行滚动
                    scrollLeft = $('.rightbody').scrollLeft();
                    let v=cubeRoot(velocity);
                    scrollLeft -= v * frameRate;
                    $('.rightbody').scrollLeft(scrollLeft);
                    // 减速
                    velocity *= deceleration;
                    // 对数衰减策略
                    // velocity *= Math.log(1 - velocity + 1);
                    // 如果速度足够小，则停止滚动
                    if (Math.abs(velocity) < 0.01) {
                        continueScrollingT = false;
                    } else {
                        // 继续滚动
                        st = setTimeout(continueScroll, frameRate*2);
                    }
                }
                function cubeRoot(x) {
                    if (x === 0||Math.abs(x)<0.1) return 0;
                    var y = Math.pow(Math.abs(x), 1/3);
                    return x < 0 ? -y : y;
                }
                function smoothScroll(startPosition, targetPosition, duration, paEle = containerWheel) {
                    console.log(startPosition, targetPosition, duration)
                    const startTime = performance.now();
                    function scrollStep(currentTime) {
                        const timeElapsed = currentTime - startTime;
                        const run = ease(timeElapsed, startPosition, targetPosition - startPosition, duration);
                        paEle.scrollLeft = run;

                        if (timeElapsed < duration && !flag) {
                            requestAnimationFrame(scrollStep);
                        }
                    }
                    function ease(t, b, c, d) {
                        // 使用 easeInOutQuad 缓动函数
                        t /= d / 2;
                        if (t < 1) return c / 2 * t * t + b;
                        t--;
                        return -c / 2 * (t * (t - 2) - 1) + b;
                    }
                    requestAnimationFrame(scrollStep);
                }
            }

            TochMoveX('*')
        </script>
        <script>
            let mouse_flag;
            let isHorizontalScroll = false; // 新增：标记当前是否是横向滚动
            let initialMoveDetected = false; // 新增：是否已检测初始移动方向
            let continueScrollingM = false;
            function mouseMoveX(container) {
                let downX;
                let downY; // 新增：记录初始Y坐标
                var scrollLeft;
                var lastMoveTime = 0;
                var lastMoveX = 0;
                var velocity = 0; // 末速度
                var frameRate = 8; // 帧率（大约60fps）
                var deceleration = 0.96; // 减速度因子，用于模拟滚动减速

                const threshold = 0; // 新增：方向判断阈值
                //鼠标按下
                $(document.body).on("mousedown", container, function (event) {

                            scrollLeft = $(this).scrollLeft();
                            lastMoveTime = Date.now();
                            lastMoveX = downX;
                            initialMoveDetected = false; // 重置方向检测
                            isHorizontalScroll = false; // 重置滚动方向
                        }
                    }
                });
                //鼠标移动
                $(container).on("mousemove", function (event) {
                    // console.log('mousemove', flag)
                    if (!mouse_flag) {return }

                    const moveX = event.clientX;
                    const moveY = event.clientY; // 获取当前Y坐标

                    if (moveX ===downX && moveY === downY){
                        return
                    }
                    // 首次移动时检测方向
                    if (!initialMoveDetected) {
                        const deltaX = Math.abs(moveX - downX);
                        const deltaY = Math.abs(moveY - downY);

                        // 判断是横向还是纵向滑动
                        if (deltaX > deltaY && deltaX > threshold) {
                            isHorizontalScroll = true;
                        } else if (deltaY > deltaX && deltaY > threshold) {
                            isHorizontalScroll = false;
                            mouse_flag = false; // 如果是纵向滑动，直接结束处理
                            return;
                        }
                        initialMoveDetected = true;
                    }

                    // 只有横向滑动才处理
                    if (isHorizontalScroll) {
                        var scrollX = moveX - downX;
                        // console.log("moveX" + moveX);
                        // console.log("scrollX" + scrollX);
                        if (scrollX < 0 && scrollLeft > 0) {
                            $(this).scrollLeft(scrollLeft - scrollX)

                            $(this).scrollLeft(scrollLeft - scrollX)
                        }

                        // 计算速度
                        var currentTime = Date.now();

                        if (timeDelta > 0) {
                            velocity = moveDelta / timeDelta;
                            lastMoveTime = currentTime;
                            lastMoveX = moveX;
                        }
                    }

                });
                //鼠标释放
                $(container).on("mouseup", function () {
                    mouse_flag = false;
                    continueScrollingM = true;
                    continueScroll();
                });
                /**
                 * 注意：与 mouseout 事件不同，mouseleave 事件只有在鼠标指针离开被选元素时被触发，
                 * mouseout 事件在鼠标指针离开任意子元素时也会被触发。参见页面底部演示实例。
                 * 所以：如果mouseout的子元素存在溢出，并添加了超出加滚动，那么刚进入也会触发该事件，所以这里就不能使用。
                 * */
                //鼠标移出元素
                $(container).on("mouseleave", function (event) {
                    // console.log('mouseleave', event.pageX, document.body.offsetWidth)
                    mouse_flag = false;
                    if (event.pageX < 0 || event.pageX > document.body.offsetWidth) {
                        // console.log('在元素上移出')
                        mouse_flag = false;
                        continueScrollingM = true;

                        continueScroll();
                    }
                    return false
                });
                // 继续滚动的函数
                liulanstate = false
                let st=0
                function continueScroll() {
                    if ((!continueScrollingM && !mouse_flag )|| liulanstate) {
                        clearTimeout(st)
                        continueScrollingM=false
                        return;
                    }
                    // 使用末速度进行滚动
                    scrollLeft = $('.rightbody').scrollLeft();
                    scrollLeft -= velocity * frameRate;
                    $('.rightbody').scrollLeft(scrollLeft);
                    // 减速
                    velocity *= deceleration;
                    // 对数衰减策略
                    // velocity *= Math.log(1 - velocity + 1);
                    // 如果速度足够小，则停止滚动
                    if (Math.abs(velocity) < 0.03) {
